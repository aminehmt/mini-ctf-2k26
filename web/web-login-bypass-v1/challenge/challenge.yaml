name: "Club des Fans Shellmates"
category: "web"
difficulty: "veryeasy"
author: "aminehmt"
description: |
  Le Club des Fans de Shellmates a un système d'accès VIP exclusif !
  Seuls les vrais fans connaissent leur code unique et leur événement préféré...
  Mais peut-être qu'avec un peu d'astuce, tu pourras accéder au salon VIP ? 🤔

  Site : http://localhost:5000

port: 5000
docker: true
notes: |
  Indice : Les fans normaux ne peuvent pas voir le contenu VIP... à moins de contourner la vérification !
  
  Setup local :
  - python init_db.py && python app.py
  - Docker : docker build -t fans-club . && docker run -p 5000:5000 fans-club
