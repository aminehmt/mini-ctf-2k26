<!DOCTYPE html>
<html>
<head>
    <title>🌟 Accès VIP Shellmates 🌟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #00ff00;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00ff00;
        }
        h2 { color: #00ff00; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #00ff00;
            background-color: #1a1a1a;
            color: #00ff00;
            border-radius: 5px;
        }
        button {
            background-color: #00ff00;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00cc00;
        }
        .error {
            color: #ff0000;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🎫 Vérification des Fans 🎫</h2>
        <!-- La vérité est dans la base... de données ! -->
        <form method="POST">
            <div class="input-group">
                <label>Code Fan</label>
                <input type="text" name="fan_code" placeholder="Ex: SHELL42" required>
                <small>Tous nos fans ont un code unique !</small>
            </div>
            <div class="input-group">
                <label>Événement Préféré</label>
                <input type="text" name="favorite_event" placeholder="Ex: Mini CTF 2025" required>
                <small>Quel événement t'a le plus marqué ?</small>
            </div>
            <div class="quote">
                "Les vrais fans savent que tout est une question de logique... et d'égalité !" - Un Admin
            </div>
            <button type="submit">🚀 Vérifier mon statut VIP 🚀</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
