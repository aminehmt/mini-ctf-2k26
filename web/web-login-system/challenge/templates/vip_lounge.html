<!DOCTYPE html>
<html>
<head>
    <title>🌟 Salon VIP Shellmates 🌟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #00ff00;
            margin: 0;
            padding: 20px;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #00ff00; }
            to { text-shadow: 0 0 20px #00ff00; }
        }
        .vip-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 { 
            color: #00ff00;
            font-size: 2em;
        }
        .flag {
            background-color: #000;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 1.2em;
            border: 2px solid #00ff00;
        }
    </style>
</head>
<body>
    <div class="vip-container">
        <h1>🎉 Bienvenue dans le Salon VIP, {{ nickname }} ! 🎉</h1>
        <p>En tant que membre VIP, voici ton cadeau exclusif :</p>
        <div class="flag">
            {{ flag }}
        </div>
        <p>🏆 Tu es vraiment un fan de première classe ! 🏆</p>
    </div>
</body>
</html>
